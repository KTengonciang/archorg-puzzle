  /* Layout: one-screen game. Thin header bar, full-bleed play area below; board on top (portrait) or centered (landscape), loose pieces around it. Single dark look matched to the slide. */
  :root {
    --bg: #131218;
    --bg-glow: #2a1f7a;
    --panel: #1b1a21;
    --line: #2c2a36;
    --fg: #eeedf5;
    --muted: #8b889c;
    --accent: #6f5ff2;
    --accent-soft: #9a90ff;
    --font-display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
    --font-body: "Manrope", "Segoe UI", system-ui, sans-serif;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background:
      radial-gradient(120% 70% at 100% 0%, color-mix(in srgb, var(--bg-glow) 55%, transparent) 0%, transparent 55%),
      var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  .app { height: 100%; display: grid; grid-template-rows: auto 1fr; }

  .bar {
    position: relative;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    background: color-mix(in srgb, var(--bg) 70%, transparent);
  }
  .brand { display: flex; align-items: baseline; gap: 8px; font-family: var(--font-display); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; font-size: 15px; line-height: 1; }
  .brand .quiz { color: var(--fg); }
  .brand .key { color: var(--accent-soft); }
  .brand .star { color: var(--accent-soft); font-size: 13px; }
  .right { display: flex; align-items: center; gap: 10px; }
  .count { font-family: var(--font-display); font-weight: 600; font-size: 15px; font-variant-numeric: tabular-nums; color: var(--fg); }
  .count span { color: var(--muted); }
  .btn {
    font: 600 13px/1 var(--font-body);
    color: var(--fg);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 8px 14px;
    cursor: pointer;
  }
  .btn:hover { border-color: var(--accent); }
  .btn:focus-visible { outline: 2px solid var(--accent-soft); outline-offset: 2px; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { background: var(--accent-soft); border-color: var(--accent-soft); }
  .progress { position: absolute; left: 0; bottom: -1px; height: 2px; width: 0; background: var(--accent); box-shadow: 0 0 10px var(--accent); transition: width .3s ease; }

  .stage { position: relative; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  .board {
    position: absolute;
    border-radius: 6px;
    background:
      linear-gradient(var(--line) 1px, transparent 1px) 0 0 / 10% 20%,
      linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0 / 10% 20%,
      color-mix(in srgb, var(--panel) 85%, transparent);
    box-shadow: 0 0 0 1px var(--line), 0 0 0 6px color-mix(in srgb, var(--panel) 60%, transparent), 0 20px 50px rgba(0,0,0,.45);
    transition: box-shadow .6s ease;
  }
  .board img { position: absolute; inset: 0; width: 100%; height: 100%; max-width: none; border-radius: 6px; opacity: 0; transition: opacity .7s ease; pointer-events: none; z-index: 2000; }
  .board.solved { box-shadow: 0 0 0 1px var(--accent), 0 0 0 6px color-mix(in srgb, var(--accent) 25%, transparent), 0 0 60px color-mix(in srgb, var(--accent) 45%, transparent); }
  .board.solved img { opacity: 1; }

  .piece {
    position: absolute; left: 0; top: 0;
    pointer-events: none;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,.55));
    transition: scale .12s ease, filter .12s ease;
    will-change: transform;
  }
  .piece.lift { filter: drop-shadow(0 12px 14px rgba(0,0,0,.6)); }
  .piece.placed { filter: none; }
  .piece.snap { transition: transform .16s cubic-bezier(.2,.9,.3,1.2); }
  .piece.flash { animation: flash .45s ease-out; }
  @keyframes flash { 0% { filter: brightness(1.6) drop-shadow(0 0 6px var(--accent-soft)); } 100% { filter: none; } }
  .piece.enter { animation: enter .45s ease-out both; }
  @keyframes enter { from { opacity: 0; scale: .7; } to { opacity: 1; scale: 1; } }

  .sheet {
    position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    translate: -50% 0;
    width: min(420px, calc(100% - 32px));
    display: grid; gap: 14px;
    padding: 18px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: 0 20px 60px rgba(0,0,0,.55);
    z-index: 5000;
    animation: rise .4s ease-out both;
  }
  @keyframes rise { from { opacity: 0; translate: -50% 20px; } to { opacity: 1; translate: -50% 0; } }
  .sheet .eyebrow { font: 600 11px/1 var(--font-display); letter-spacing: .14em; text-transform: uppercase; color: var(--accent-soft); }
  .sheet h2 { margin: 6px 0 0; font: 700 22px/1.1 var(--font-display); letter-spacing: .02em; }
  .sheet .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .sheet .actions .btn { flex: 1 1 140px; padding: 12px 14px; font-size: 14px; }

  .viewer { position: fixed; inset: 0; z-index: 6000; background: rgba(8,8,12,.92); display: grid; place-items: center; padding: 16px; }
  .viewer img { max-width: 100%; max-height: calc(100% - 64px); border-radius: 8px; box-shadow: 0 20px 60px rgba(0,0,0,.6); user-select: auto; -webkit-user-select: auto; -webkit-touch-callout: default; }
  .viewer .close { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); right: 16px; }
  .viewer .tip { position: absolute; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: 16px; right: 16px; text-align: center; color: var(--muted); font-size: 13px; }

  .piece.gone { opacity: 0; transition: opacity .5s ease; }
  .scare { position: fixed; inset: 0; z-index: 9000; background: #000; display: grid; place-items: center; overflow: hidden; }
  .scare img { width: 100%; height: 100%; max-width: none; object-fit: fill; animation: lunge .18s ease-out both, shake .09s linear .18s infinite; }
  @keyframes lunge { from { transform: scale(.85); } to { transform: scale(1.12); } }
  @keyframes shake {
    0% { transform: scale(1.12) translate(0, 0); }
    25% { transform: scale(1.12) translate(-1.5%, 1%); }
    50% { transform: scale(1.12) translate(1.5%, -1%); }
    75% { transform: scale(1.12) translate(-1%, -1.5%); }
    100% { transform: scale(1.12) translate(0, 0); }
  }
  .boo {
    position: fixed; inset: 0; z-index: 8000; overflow-y: auto;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    padding: calc(24px + env(safe-area-inset-top, 0px)) 16px calc(24px + env(safe-area-inset-bottom, 0px));
    background: radial-gradient(120% 70% at 100% 0%, color-mix(in srgb, var(--bg-glow) 55%, transparent) 0%, transparent 55%), var(--bg);
  }
  .boo h1 {
    margin: 0; font: 700 clamp(52px, 15vw, 128px)/.9 var(--font-display); letter-spacing: .02em;
    color: var(--accent-soft); text-shadow: 0 0 40px color-mix(in srgb, var(--accent) 60%, transparent);
    animation: pop .5s cubic-bezier(.2,1.4,.4,1) both;
  }
  @keyframes pop { from { opacity: 0; transform: scale(.4) rotate(-6deg); } to { opacity: 1; transform: none; } }
  .boo img { width: min(900px, 100%); border-radius: 10px; box-shadow: 0 0 0 1px var(--line), 0 20px 60px rgba(0,0,0,.55); user-select: auto; -webkit-user-select: auto; -webkit-touch-callout: default; animation: rise2 .5s .15s ease-out both; }
  @keyframes rise2 { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  .boo .actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; width: min(420px, 100%); }

    .brand { font-size: 13px; }
    .btn { padding: 7px 12px; }

    .piece, .piece.snap, .board, .board img, .progress { transition: none; }

  }

    const P = (u, v) => [x0 + dx * u + nx * v * S * sign, y0 + dy * u + ny * v * S * sign];
    p.lineTo(...P(.35, 0));
    for (const [a, b, c] of CURVES) p.bezierCurveTo(...P(...a), ...P(...b), ...P(...c));
    p.lineTo(x1, y1);
  }
  function buildPath(pc) {
    const p = new Path2D();
    const L = pad, T = pad, R = pad + pw, B = pad + ph;
    p.moveTo(L, T);
    edge(p, L, T, R, T, 0, -1, pc.top);
    edge(p, R, T, R, B, 1, 0, pc.right);
    edge(p, R, B, L, B, 0, 1, pc.bottom);
    edge(p, L, B, L, T, -1, 0, pc.left);
    p.closePath();
    return p;
  }
  function draw(pc) {
    const cw = pw + 2 * pad, ch = ph + 2 * pad;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const el = pc.el, ctx = el.getContext('2d');
    el.width = Math.round(cw * dpr); el.height = Math.round(ch * dpr);
    el.style.width = cw + 'px'; el.style.height = ch + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, cw, ch);
    ctx.save();
    ctx.clip(pc.path);
    ctx.drawImage(img, pad - pc.c * pw, pad - pc.r * ph, COLS * pw, ROWS * ph);
    ctx.lineWidth = 2.2; ctx.strokeStyle = 'rgba(255,255,255,.13)'; ctx.stroke(pc.path);
    ctx.restore();
    ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(0,0,0,.55)'; ctx.stroke(pc.path);
  }
  function setPos(pc) { pc.el.style.transform = `translate3d(${pc.x - pad}px, ${pc.y - pad}px, 0)`; }
  const target = pc => [bx + pc.c * pw, by + pc.r * ph];

  // ---- layout ----
  function layout() {
    const rect = stage.getBoundingClientRect();
    W = rect.width; H = rect.height;
    const m = Math.max(12, Math.min(W, H) * .025);
    const A = IW / IH;
    const portrait = W / H < 1.1;
    if (portrait) {
      bw = W - 2 * m;
      if (bw / A > H * .42) bw = H * .42 * A;
    } else {
      bw = Math.min(Math.sqrt(.27 * W * H * A), W - 2 * m, (H - 2 * m) * A);
    }
    bh = bw / A;
    bx = (W - bw) / 2;
    by = portrait ? m : (H - bh) / 2;
    pw = bw / COLS; ph = bh / ROWS; S = Math.min(pw, ph);
    pad = Math.ceil(S * .34) + 2;
    Object.assign(boardEl.style, { left: bx + 'px', top: by + 'px', width: bw + 'px', height: bh + 'px' });
    for (const pc of pieces) {
      pc.path = buildPath(pc);
      draw(pc);
      if (pc.placed) { [pc.x, pc.y] = target(pc); }
      else { pc.x = pc.fx * W; pc.y = pc.fy * H; clampPos(pc); }
      setPos(pc);
    }
  }
  function clampPos(pc) {
    const e = pad * .5;
    pc.x = Math.min(Math.max(pc.x, e), W - pw - e);
    pc.y = Math.min(Math.max(pc.y, e), H - ph - e);
  }
  function overlap(ax, ay, aw, ah, bx2, by2, bw2, bh2) {
    const w = Math.min(ax + aw, bx2 + bw2) - Math.max(ax, bx2);
    const h = Math.min(ay + ah, by2 + bh2) - Math.max(ay, by2);
    return w > 0 && h > 0 ? w * h : 0;
  }
  function scatter(onlyOnBoard) {
    const e = pad * .5;
    const loose = pieces.filter(pc => !pc.placed);
    const fixed = [];
    const todo = [];
    for (const pc of loose) {
      const onBoard = overlap(pc.x, pc.y, pw, ph, bx - e, by - e, bw + 2 * e, bh + 2 * e) > 0;
      if (!onlyOnBoard || onBoard) todo.push(pc); else fixed.push(pc);
    }
    todo.sort(() => Math.random() - .5);
    for (const pc of todo) {
      let best = null, bestScore = Infinity;
      for (let t = 0; t < 40; t++) {
        const x = e + Math.random() * Math.max(1, W - pw - 2 * e);
        const y = e + Math.random() * Math.max(1, H - ph - 2 * e);
        let score = overlap(x, y, pw, ph, bx - pad, by - pad, bw + 2 * pad, bh + 2 * pad) * 6;
        for (const o of fixed) score += overlap(x, y, pw, ph, o.x, o.y, pw, ph);
        if (score < bestScore) { bestScore = score; best = [x, y]; if (score === 0) break; }
      }
      [pc.x, pc.y] = best;
      pc.fx = pc.x / W; pc.fy = pc.y / H;
      pc.z = ++zTop; pc.el.style.zIndex = pc.z;
      setPos(pc);
      fixed.push(pc);
    }
  }

  // ---- interaction ----
  function local(e) { const r = stage.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
  function pick(sx, sy) {
    const loose = pieces.filter(pc => !pc.placed).sort((a, b) => b.z - a.z);
    for (const pc of loose) {
      const lx = sx - (pc.x - pad), ly = sy - (pc.y - pad);
      if (lx < 0 || ly < 0 || lx > pw + 2 * pad || ly > ph + 2 * pad) continue;
      if (hitCtx.isPointInPath(pc.path, lx, ly)) return pc;
    }
    // forgiving fallback for small fingers
    let best = null, bd = S * .6;
    for (const pc of loose) {
      const d = Math.hypot(sx - (pc.x + pw / 2), sy - (pc.y + ph / 2));
      if (d < bd) { bd = d; best = pc; }
    }
    return best;
  }
  let audio = null;
  // recorded-style scream in an <audio> element: louder, and it still plays on iPhones in silent mode
  const screamEl = new Audio(SCREAM);
  screamEl.preload = 'auto';
  let primed = false;
  function unlockAudio() {
    try {
      if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state === 'suspended') audio.resume();
    } catch (_) {}
    if (primed) return;
    primed = true;
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (_) {}
    try {
      // play the silent start of the file during a real tap so the browser lets it play loud later
      screamEl.muted = false; screamEl.currentTime = 0;
      const p = screamEl.play();
      const reset = () => setTimeout(() => { if (!done) { screamEl.pause(); screamEl.currentTime = 0; } }, 40);
      if (p && p.then) p.then(reset, () => { primed = false; }); else reset();
    } catch (_) { primed = false; }
  }
  ['touchend', 'pointerup', 'click', 'keydown'].forEach(ev => document.addEventListener(ev, unlockAudio, { capture: true, passive: true }));
  function scream() {
    try {
      screamEl.pause(); screamEl.muted = false; screamEl.volume = 1; screamEl.currentTime = LEAD;
      const p = screamEl.play();
      if (p && p.catch) p.catch(() => synthScream());
    } catch (_) { synthScream(); }
  }
  function synthScream() {
    if (!audio) return;
    try {
      const t = audio.currentTime, dur = 1.5;
      const out = audio.createGain();
      out.gain.setValueAtTime(0.0001, t);
      out.gain.exponentialRampToValueAtTime(0.9, t + 0.02);
      out.gain.setValueAtTime(0.9, t + dur - 0.4);
      out.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      const shaper = audio.createWaveShaper();
      const curve = new Float32Array(1024);
      for (let i = 0; i < 1024; i++) { const x = i / 512 - 1; curve[i] = Math.tanh(x * 6); }
      shaper.curve = curve;
      shaper.connect(out); out.connect(audio.destination);
      // screeching voices
      [[620, 1650], [910, 2100], [470, 1280]].forEach(([a, b], i) => {
        const o = audio.createOscillator(); o.type = i === 1 ? 'square' : 'sawtooth';
        o.frequency.setValueAtTime(a, t);
        o.frequency.exponentialRampToValueAtTime(b, t + 0.25);
        o.frequency.exponentialRampToValueAtTime(b * 0.8, t + dur);
        const lfo = audio.createOscillator(), lg = audio.createGain();
        lfo.frequency.value = 9 + i * 4; lg.gain.value = 90;
        lfo.connect(lg); lg.connect(o.frequency);
        const g = audio.createGain(); g.gain.value = 0.25;
        o.connect(g); g.connect(shaper);
        o.start(t); lfo.start(t); o.stop(t + dur); lfo.stop(t + dur);
      });
      // noise burst
      const len = Math.floor(audio.sampleRate * dur);
      const buf = audio.createBuffer(1, len, audio.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      const n = audio.createBufferSource(); n.buffer = buf;
      const ng = audio.createGain(); ng.gain.value = 0.35;
      n.connect(ng); ng.connect(shaper); n.start(t);
    } catch (_) {}
  }
  let faceUrl = null;
  function jumpscare() {
    done = true; drag = null;
    document.getElementById('shuffle').hidden = true;
    const sc = document.getElementById('scare');
    if (faceUrl) document.getElementById('scareImg').src = faceUrl;
    sc.hidden = false;
    scream();
    try { navigator.vibrate && navigator.vibrate([400, 80, 400, 80, 600]); } catch (_) {}
    setTimeout(() => {
      document.getElementById('booImg').src = imgUrl;
      document.getElementById('boo').hidden = false;
      sc.hidden = true;
    }, SCARE_MS);
  }

  stage.addEventListener('pointerdown', e => {
    unlockAudio();
    if (done || drag || !img) return;
    const [sx, sy] = local(e);
    const pc = pick(sx, sy);
    if (!pc) return;
    e.preventDefault();
    stage.setPointerCapture(e.pointerId);
    drag = { pc, id: e.pointerId, ox: sx - pc.x, oy: sy - pc.y };
    pc.z = ++zTop; pc.el.style.zIndex = pc.z;
    pc.el.classList.remove('snap', 'enter');
    pc.el.classList.add('lift');
  });
  stage.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.id) return;
    const [sx, sy] = local(e);
    const pc = drag.pc;
    pc.x = sx - drag.ox; pc.y = sy - drag.oy;
    clampPos(pc);
    setPos(pc);
  });
  function endDrag(e) {
    if (!drag || e.pointerId !== drag.id) return;
    const pc = drag.pc;
    drag = null;
    pc.el.classList.remove('lift');
    const [tx, ty] = target(pc);
    // snap when the piece's middle lands anywhere inside its own cell (plus a little extra)
    const tolX = Math.max(pw * .6, 22), tolY = Math.max(ph * .6, 22);
    if (Math.abs(pc.x - tx) < tolX && Math.abs(pc.y - ty) < tolY) {
      pc.placed = true;
      pc.x = tx; pc.y = ty;
      pc.el.classList.add('snap', 'placed');
      pc.z = 10 + pc.r * COLS + pc.c; pc.el.style.zIndex = pc.z;
      setPos(pc);
      requestAnimationFrame(() => { pc.el.classList.remove('flash'); void pc.el.offsetWidth; pc.el.classList.add('flash'); });
      placed++;
      updateCount();
      if (placed === SCARE_AT) jumpscare();
      else if (placed === TOTAL) finish();
    } else {
      pc.fx = pc.x / W; pc.fy = pc.y / H;
    }
  }
  stage.addEventListener('pointerup', endDrag);
  stage.addEventListener('pointercancel', endDrag);
  stage.addEventListener('contextmenu', e => e.preventDefault());

  function updateCount() {
    countEl.innerHTML = `${placed}<span> / ${TOTAL}</span>`;
    progressEl.style.width = (placed / TOTAL * 100) + '%';
  }

  function finish() {
    done = true;
    document.getElementById('shuffle').hidden = true;
    for (const pc of pieces) if (!pc.placed) pc.el.classList.add('gone');
    countEl.innerHTML = `${TOTAL}<span> / ${TOTAL}</span>`;
    progressEl.style.width = '100%';
    const reveal = new Image();
    reveal.src = imgUrl; reveal.alt = 'Quiz answer key';
    boardEl.appendChild(reveal);
    setTimeout(() => boardEl.classList.add('solved'), reduced ? 0 : 250);
    setTimeout(() => { sheet.hidden = false; }, reduced ? 0 : 900);
  }

  document.getElementById('shuffle').addEventListener('click', () => { if (!done) scatter(false); });
  document.getElementById('save').addEventListener('click', () => {
    const a = document.createElement('a');
    a.href = imgUrl; a.download = 'answer-key.png';
    document.body.appendChild(a); a.click(); a.remove();
  });
  document.getElementById('booSave').addEventListener('click', () => document.getElementById('save').click());
  document.getElementById('view').addEventListener('click', () => {
    document.getElementById('viewImg').src = imgUrl;
    viewer.hidden = false;
  });
  document.getElementById('close').addEventListener('click', () => { viewer.hidden = true; });
  viewer.addEventListener('click', e => { if (e.target === viewer) viewer.hidden = true; });

  let resizeT;
  window.addEventListener('resize', () => {
    clearTimeout(resizeT);
    resizeT = setTimeout(() => { if (!img) return; layout(); if (!done) scatter(true); }, 120);
  });

  // ---- start ----
  function start() {
    const { h, v } = makeEdges();
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      const el = document.createElement('canvas');
      el.className = 'piece' + (reduced ? '' : ' enter');
      el.style.animationDelay = (Math.random() * .35).toFixed(2) + 's';
      stage.appendChild(el);
      pieces.push({
        c, r, el, placed: false, x: 0, y: 0, fx: .5, fy: .5, z: 0,
        top: r === 0 ? 0 : -h[r][c],
        bottom: r === ROWS - 1 ? 0 : h[r + 1][c],
        left: c === 0 ? 0 : -v[r][c],
        right: c === COLS - 1 ? 0 : v[r][c + 1],
      });
    }
    layout();
    scatter(false);
    document.getElementById('loading').remove();
  }

  imgUrl = decodeUrl(DATA, 'image/png');
  img = null;
  try {
    faceUrl = decodeUrl(FACE, FACE_TYPE);
    const pre = new Image(); pre.src = faceUrl;
    if (pre.decode) pre.decode().catch(() => {});
  } catch (_) {}
  const im = new Image();
  im.onload = () => { img = im; IW = im.naturalWidth; IH = im.naturalHeight; start(); };
  im.onerror = () => { const l = document.getElementById('loading'); if (l) l.textContent = "Couldn't load. Open this link in Chrome or Safari."; };
  im.src = imgUrl;
})();
</script>

</body>
